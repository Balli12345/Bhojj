name: BHOJJ Native Apps CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web-build:
    name: TypeScript and production build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer-app, restaurant-app, delivery-app, admin-app]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Build production web assets
        run: npm run build
